# aire — CI.
#
# There was none. deploy.yml built the app on the way to GitHub Pages, so a broken build was
# discovered as a failed DEPLOY of master — after the fact, on the branch that is live.
#
# Every job below exists because of a failure that shows up nowhere locally, not because a
# step existed and looked tidy:
#
#   * typecheck + build     the ordinary one. It is also the only thing standing between a
#                           type error and a red deploy.
#   * the solved palette    aire's colour is GENERATED. Three files have to agree with the
#     is still the          solver and nothing in the app notices when they stop: every
#     source of truth       assertion nilam makes runs against freshly solved objects, so a
#                           stale stylesheet measures perfect while shipping the wrong hue.
#                           This is the job worth having.
#
# NO LINT JOB. `npm run lint` does not exist — package.json has dev, build, preview and
# typecheck — so a lint step would fail on the first push for the wrong reason. Whether aire
# should have a linter is a separate decision, not a side effect of adding CI.
#
# NO TEST JOB, for the same reason: there is no test script. Nothing here needed one — the
# palette checks are shell steps, so no npm script was invented to host them.
#
# ONE ODDITY WORTH KNOWING BEFORE EDITING THIS FILE'S PROSE. Tailwind v4 auto-detects its
# sources and scans every tracked file, this one included, so a bare utility name written in a
# COMMENT becomes a real rule in the stylesheet users download. The first draft of the line
# above used one and put 29 bytes of dead visibility CSS into dist — measured by building with
# and without this file, and the reason it now reads "shows up nowhere locally". README.md
# already does the same with a bare display utility; that one is pre-existing and is left
# alone. Scoping the scan with `@source not` in src/index.css would fix the class of problem
# and is the obvious next step, but it is a change to the app's stylesheet rather than to CI.

name: CI

on:
  push:
    # Both names, matching deploy.yml. If the default branch is ever renamed, CI must not
    # quietly stop running on push while the deploy carries on.
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22, because that is what deploy.yml pins. CI on a different major would make a
          # green tick mean something other than "the deploy will work", which is the only
          # thing anybody reads it as.
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      # `npm run build` is `tsc --noEmit && vite build`, so this is deliberately redundant.
      # It costs a couple of seconds and it means a type error reports AS a type error,
      # instead of as a build failure with tsc's output buried at the top of it.
      - run: npm run typecheck

      - run: npm run build

  palette:
    name: the solved palette is still the source of truth
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      # ── the vendored token file ─────────────────────────────────────────
      #
      # src/nilam.tokens.aire.css is generated by `npx nilam 219.5`, and this is the same
      # check nilam's own CI runs on its emitted CSS, for the same reason: the file is the
      # ONLY place the solved numbers reach the app, and nothing downstream can tell that it
      # is out of date. Bump nilam, forget to re-solve, and the app ships last release's
      # palette while typecheck, build and deploy all pass. There is no symptom to notice.
      #
      # ./node_modules/.bin/nilam and not `npx nilam`, deliberately. Bare `npx` will fetch
      # the registry's LATEST when the local copy is missing, which would make this job green
      # or red depending on what nilam published this week rather than on what package.json
      # pins. The pinned binary is the only one whose output the repo is allowed to contain.
      - name: re-solve the vendored tokens and diff
        run: |
          set -euo pipefail
          ./node_modules/.bin/nilam 219.5 --css=src/nilam.tokens.aire.css | tee /tmp/nilam.txt
          if ! git diff --exit-code -- src/nilam.tokens.aire.css; then
            echo "::error::src/nilam.tokens.aire.css is stale. Run \`npx nilam 219.5 --css=src/nilam.tokens.aire.css\` and commit the result."
            exit 1
          fi
          echo "the vendored tokens match the solver"

      # The assertion COUNT is not in the emitted file, so the diff above cannot see it move.
      # src/index.css and the README both state 498 in each gamut as fact; this is what keeps
      # those two sentences true. A solver change that quietly proved LESS would otherwise
      # leave the same tokens on disk and the same green tick.
      - name: the proof is still 498 assertions in both gamuts
        run: |
          set -euo pipefail
          grep -qE '^  498 assertions$' /tmp/nilam.txt
          grep -qE '^  all passed$' /tmp/nilam.txt
          grep -qE '^  display-p3: 498 assertions, all passed$' /tmp/nilam.txt
          echo "498 sRGB + 498 display-p3, all passed"

      # ── the three literals in index.html ────────────────────────────────
      #
      # A <meta content> attribute and an SVG data: URI have no cascade, so three values in
      # index.html are hand-transcribed from solved tokens — two theme-colours and the
      # favicon circle. They are the one part of the palette a re-solve cannot reach, which
      # makes them the one part that goes stale silently: the browser chrome would paint a
      # colour the page no longer uses and every check above would still pass.
      #
      # The expected hexes are DERIVED from the solver rather than written down here. Copying
      # them into this file would just move the staleness one directory sideways.
      #
      # Positional, not "appears somewhere": each literal is matched in its own attribute, so
      # swapping the light and dark theme-colours fails too.
      - name: the three index.html literals still match the solved tokens
        run: |
          node --input-type=module <<'EOF'
          import { readFileSync } from "node:fs";
          import { solvePalette, solveSemanticHues, toHex } from "nilam";

          const html = readFileSync("index.html", "utf8");
          const p = solvePalette(219.5, { semanticHues: solveSemanticHues(219.5).hues });

          const found = (re, label) => {
            const m = html.match(re);
            if (!m) throw new Error("could not find the " + label + " in index.html — the check needs updating, not silencing");
            return m[1].toLowerCase();
          };

          const cases = [
            ["light theme-color", "--neutral-1 light", toHex(p.light.neutral[1]),
              found(/content="(#[0-9a-f]{6})" media="\(prefers-color-scheme: light\)"/i, "light theme-color meta")],
            ["dark theme-color", "--neutral-1 dark", toHex(p.dark.neutral[1]),
              found(/content="(#[0-9a-f]{6})" media="\(prefers-color-scheme: dark\)"/i, "dark theme-color meta")],
            ["favicon circle", "--brand-9 dark", toHex(p.dark.brand[9]),
              "#" + found(/rel="icon"[^>]*fill='%23([0-9a-f]{6})'/i, "favicon fill")],
          ];

          let stale = 0;
          for (const [where, token, want, got] of cases) {
            const ok = got === want.toLowerCase();
            console.log((ok ? "ok    " : "STALE ") + where + "  " + token + "  solver " + want + "  index.html " + got);
            if (!ok) stale++;
          }
          if (stale) {
            console.error("::error::" + stale + " literal(s) in index.html no longer match the palette solved at hue 219.5. Update them to the solver values printed above.");
            process.exit(1);
          }
          console.log("all three literals match the solver");
          EOF
