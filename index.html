<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Two theme-colours, because the app now has two modes. There was one, #0a0a0a, and
         it painted the browser chrome near-black over a light page. Both values are the
         solved --neutral-1: light oklch(0.98 0.007 219.5), dark oklch(0.175 0.007 219.5).
         Literal hex because a <meta> content attribute cannot read a custom property; the
         numbers are transcribed from src/nilam.tokens.aire.css, not chosen. -->
    <meta name="theme-color" content="#f4fafc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d1113" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="aire — realtime polling at the edge." />
    <title>aire — realtime polls</title>
    <!-- The mark, and the one other place a token cannot reach: an SVG data: URI has no
         cascade. #28a1c0 is the solved dark-mode --brand-9 (oklch(0.66 0.1102 219.5)),
         transcribed. It replaces #00d4ff, the neon whose chroma sat on the sRGB gamut
         edge. The favicon is drawn on browser chrome of unknown lightness, so the dark
         value is used for both: at L 0.66 it is the one that survives either ground. -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%2328a1c0'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
